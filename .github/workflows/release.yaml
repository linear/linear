name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a sample SDK release Slack notification without running the release
        type: boolean
        default: false

concurrency:
  group: sdk-publish
  cancel-in-progress: false
  # Preserve every queued release snapshot so later master pushes cannot replace one.
  queue: max

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/master' && !inputs.send_test_notification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for OIDC (https://docs.npmjs.com/trusted-publishers#github-actions-configuration)
      pull-requests: read
    env:
      SKIP_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Report skipped release
        if: env.SKIP_RELEASE == 'true'
        run: echo 'Publishing skipped by [skip release]. Validation still runs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Use node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Ensure npm >= 11.5.1 for OIDC trusted publishers (https://docs.npmjs.com/trusted-publishers#github-actions-configuration)
      # Two-step upgrade works around broken npm in Node 22.22.2 (nodejs/node#62425)
      - name: Update npm
        run: |
          npm_major=$(npm --version | cut -d. -f1)
          if [ "$npm_major" -lt 11 ]; then
            npm install -g npm@10 && npm install -g npm@latest
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Cache npx tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-arethetypeswrong-0.18.2

      - name: Validate CJS and ESM resolution for SDK
        # Catch issues like https://github.com/linear/linear/issues/830
        run: npx @arethetypeswrong/cli@0.18.2 --pack packages/sdk

      - name: Check for no generated changes
        run: test -z "$(git status --porcelain)"

      # schema.yaml is the only workflow that prepares release pull requests; pending changesets must be versioned there.
      - name: Publish to npm
        id: publish
        if: env.SKIP_RELEASE != 'true' && hashFiles('.changeset/*.md', '!.changeset/README.md') == ''
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CLI_CHANNEL_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.publishedPackages }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RELEASES=$(jq -r '
            map("• <https://www.npmjs.com/package/\(.name)/v/\(.version)|\(.name) v\(.version)>")
            | join("\n")
          ' <<< "$PUBLISHED_PACKAGES")

          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || true)
          PR_NUMBER=$(jq -r 'map(select(.merged_at != null)) | first | .number // empty' <<< "${PR_JSON:-[]}" 2>/dev/null || true)
          APPROVAL=""
          PR_LINK=""
          if [[ -n "$PR_NUMBER" ]]; then
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            PR_LINK=" — <${PR_URL}|#${PR_NUMBER}>"
            REVIEWS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" 2>/dev/null || true)
            APPROVERS=$(jq -r '
              map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
              | group_by(.user.login)
              | map(max_by(.submitted_at) | select(.state == "APPROVED") | "<https://github.com/\(.user.login)|@\(.user.login)>")
              | join(", ")
            ' <<< "${REVIEWS:-[]}" 2>/dev/null || true)
            if [[ -n "$APPROVERS" ]]; then
              APPROVAL=", approved by ${APPROVERS}"
            fi
          fi

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg text ":rocket: SDK release published by ${ACTOR}${APPROVAL}${PR_LINK} — <${RUN_URL}|View Run>
          ${RELEASES}" \
              '{text: $text}')"

  test-slack-notification:
    name: Test Slack notification
    if: inputs.send_test_notification
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CLI_CHANNEL_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg text ":rocket: [TEST] SDK release published by ${ACTOR}, approved by <https://github.com/${ACTOR}|@${ACTOR}> — <${RUN_URL}|View Run>
          • <https://www.npmjs.com/package/@linear/sdk/v/0.0.0-sample|@linear/sdk v0.0.0-sample>
          • <https://www.npmjs.com/package/@linear/import/v/0.0.0-sample|@linear/import v0.0.0-sample>" \
              '{text: $text}')"

  notify-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release]
    permissions:
      actions: read
      contents: read
    if: ${{ always() && github.ref_name == 'master' && contains(needs.*.result, 'failure') }}
    steps:
      - uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # 2.3.0
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "SDK CI check failed on master branch"
          message_format: ":x: Check failed in <{repo_url}|{repo}@{branch}> on <{commit_url}|{commit_sha}>"
          footer: <{run_url}|View Run>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
