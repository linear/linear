name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sdk-publish
  cancel-in-progress: false
  # Preserve every queued release snapshot so later master pushes cannot replace one.
  queue: max

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for OIDC (https://docs.npmjs.com/trusted-publishers#github-actions-configuration)
      pull-requests: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published_packages: ${{ steps.publish.outputs.publishedPackages }}
    env:
      SKIP_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Report skipped release
        if: env.SKIP_RELEASE == 'true'
        run: echo 'Publishing skipped by [skip release]. Validation still runs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      # This job can mint npm publish tokens, so every tool it runs must be an exact version. Pin an exact Node release
      # whose bundled npm (11.19.1) meets the >= 11.5.1 needed for OIDC trusted publishers, instead of installing
      # npm@latest (https://docs.npmjs.com/trusted-publishers#github-actions-configuration).
      - name: Use node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.2"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Check bundled npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); process.exit(major > 11 || (major === 11 && minor >= 5) ? 0 : 1)' "$(npm --version)"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Validate CJS and ESM resolution for SDK
        # Catch issues like https://github.com/linear/linear/issues/830
        # The SDK is ESM-only, so CommonJS consumers on node16 resolution are expected to resolve to ESM
        # Runs the locked workspace devDependency, never npx, so no unlocked code is fetched in this job.
        run: pnpm check:exports

      - name: Check for no generated changes
        run: test -z "$(git status --porcelain)"

      # schema.yaml is the only workflow that prepares release pull requests; pending changesets must be versioned there.
      - name: Publish to npm
        id: publish
        if: env.SKIP_RELEASE != 'true' && hashFiles('.changeset/*.md', '!.changeset/README.md') == ''
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CLI_CHANNEL_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.publishedPackages }}
        run: |
          node .github/scripts/create-release-slack-message.mjs
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/sdk-release-slack.json"

  # Syncs each published package to its own Linear pipeline, which moves an issue to Done once the package it changed
  # ships. Release notes come from the version's CHANGELOG.md section. A missing notes file fails the whole sync, so we
  # only pass one when that section exists.
  # This job runs apart from the release job so the Linear action and CLI can't mint npm tokens or push to the repo.
  linear-release:
    name: Linear release
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # The Linear CLI scans commits since the pipeline's last release.
          persist-credentials: false

      - name: Prepare Linear releases
        id: versions
        env:
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published_packages }}
        run: |
          jq -r '.[] | "\(.name | ltrimstr("@linear/")) \(.version)"' <<< "$PUBLISHED_PACKAGES" |
            while read -r package version; do
              echo "$package=$version" >> "$GITHUB_OUTPUT"

              # Lines under the "## <version>" heading, up to the next "## " heading.
              notes="$RUNNER_TEMP/$package-notes.md"
              awk -v heading="## $version" '/^## / { found = ($0 == heading); next } found' "packages/$package/CHANGELOG.md" > "$notes"
              if [ -s "$notes" ]; then
                echo "${package}_notes=$notes" >> "$GITHUB_OUTPUT"
              fi
            done

      - name: Sync Linear SDK release
        if: steps.versions.outputs.sdk
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_SDK_RELEASE_ACCESS_KEY }}
          name: ${{ steps.versions.outputs.sdk }}
          version: ${{ steps.versions.outputs.sdk }}
          include_paths: packages/sdk/**
          release_notes: ${{ steps.versions.outputs.sdk_notes }}
          links: |
            NPM=https://www.npmjs.com/package/@linear/sdk/v/${{ steps.versions.outputs.sdk }}
            GitHub=${{ github.server_url }}/${{ github.repository }}/releases/tag/%40linear/sdk%40${{ steps.versions.outputs.sdk }}
            Action Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Sync Linear import release
        if: steps.versions.outputs.import
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_IMPORT_RELEASE_ACCESS_KEY }}
          name: ${{ steps.versions.outputs.import }}
          version: ${{ steps.versions.outputs.import }}
          include_paths: packages/import/**
          release_notes: ${{ steps.versions.outputs.import_notes }}
          links: |
            NPM=https://www.npmjs.com/package/@linear/import/v/${{ steps.versions.outputs.import }}
            GitHub=${{ github.server_url }}/${{ github.repository }}/releases/tag/%40linear/import%40${{ steps.versions.outputs.import }}
            Action Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release]
    permissions:
      actions: read
      contents: read
    if: ${{ always() && github.ref_name == 'master' && contains(needs.*.result, 'failure') }}
    steps:
      - uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # 2.3.0
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "SDK CI check failed on master branch"
          message_format: ":x: Check failed in <{repo_url}|{repo}@{branch}> on <{commit_url}|{commit_sha}>"
          footer: <{run_url}|View Run>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
