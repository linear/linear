name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sdk-publish
  cancel-in-progress: false
  # Preserve every queued release snapshot so later master pushes cannot replace one.
  queue: max

permissions: {}

jobs:
  # Packs the tarballs without publish credentials and uploads them before lint, tests and npx tools can change them.
  build:
    name: Build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    env:
      SKIP_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Report skipped release
        if: env.SKIP_RELEASE == 'true'
        run: echo 'Publishing skipped by [skip release]. Validation still runs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Use node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Check for no generated changes
        run: test -z "$(git status --porcelain)"

      # schema.yaml is the only workflow that prepares release pull requests; pending changesets must be versioned there.
      - name: Check for release
        id: release
        if: env.SKIP_RELEASE != 'true' && hashFiles('.changeset/*.md', '!.changeset/README.md') == ''
        run: echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Package for npm
        run: |
          pnpm --dir packages/sdk pack --out "$RUNNER_TEMP/npm/linear-sdk.tgz"
          pnpm --dir packages/import pack --out "$RUNNER_TEMP/npm/linear-import.tgz"

      - name: Upload npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm
          path: ${{ runner.temp }}/npm
          retention-days: 1

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Cache npx tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-arethetypeswrong-0.18.5

      - name: Validate CJS and ESM resolution for SDK
        # Catch issues like https://github.com/linear/linear/issues/830
        # The SDK is ESM-only, so CommonJS consumers on node16 resolution are expected to resolve to ESM
        run: npx @arethetypeswrong/cli@0.18.5 "$RUNNER_TEMP/npm/linear-sdk.tgz" --ignore-rules cjs-resolves-to-esm

  # Every step here can mint npm publish tokens, so it only runs Node's bundled npm on the tarballs from the build job.
  release:
    name: Release
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # Required for OIDC (https://docs.npmjs.com/trusted-publishers#github-actions-configuration)
    outputs:
      published_packages: ${{ steps.publish.outputs.published_packages }}
    steps:
      # Node 24 bundles npm >= 11.5.1, which OIDC trusted publishing requires.
      - name: Use node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm

      # Publishes the SDK first because @linear/import depends on it. Skips versions that are already on npm.
      - name: Publish to npm
        id: publish
        run: |
          touch published.jsonl
          for tarball in linear-sdk.tgz linear-import.tgz; do
            package=$(tar -xOzf "$tarball" package/package.json | jq -c '{name, version}')
            spec=$(jq -r '"\(.name)@\(.version)"' <<< "$package")
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "Skipping $spec because it is already on npm"
            else
              npm publish "$tarball"
              echo "$package" >> published.jsonl
            fi
          done
          echo "published_packages=$(jq -cs . published.jsonl)" >> "$GITHUB_OUTPUT"

  # Tags and announces the release apart from the release job, so nothing that can push to the repo can mint npm tokens.
  github-release:
    name: GitHub release
    needs: [release]
    if: needs.release.outputs.published_packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISHED_PACKAGES: ${{ needs.release.outputs.published_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Create GitHub releases
        run: |
          jq -r '.[] | "\(.name) \(.version)"' <<< "$PUBLISHED_PACKAGES" |
            while read -r name version; do
              .github/scripts/release-notes.sh "${name#@linear/}" "$version" |
                gh release create "$name@$version" --target "$GITHUB_SHA" --title "$name@$version" --notes-file -
            done

      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CLI_CHANNEL_WEBHOOK_URL }}
        run: |
          node .github/scripts/create-release-slack-message.mjs
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/sdk-release-slack.json"

  # Syncs each published package to its own Linear pipeline, which moves an issue to Done once the package it changed
  # ships. Release notes come from the version's CHANGELOG.md section. A missing notes file fails the whole sync, so we
  # only pass one when that section exists.
  # This job runs apart from the release job so the Linear action and CLI can't mint npm tokens or push to the repo.
  linear-release:
    name: Linear release
    needs: [release]
    if: needs.release.outputs.published_packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # The Linear CLI scans commits since the pipeline's last release.
          persist-credentials: false

      - name: Prepare Linear releases
        id: versions
        env:
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published_packages }}
        run: |
          jq -r '.[] | "\(.name | ltrimstr("@linear/")) \(.version)"' <<< "$PUBLISHED_PACKAGES" |
            while read -r package version; do
              echo "$package=$version" >> "$GITHUB_OUTPUT"

              notes="$RUNNER_TEMP/$package-notes.md"
              .github/scripts/release-notes.sh "$package" "$version" > "$notes"
              if [ -s "$notes" ]; then
                echo "${package}_notes=$notes" >> "$GITHUB_OUTPUT"
              fi
            done

      - name: Sync Linear SDK release
        if: steps.versions.outputs.sdk
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_SDK_RELEASE_ACCESS_KEY }}
          name: ${{ steps.versions.outputs.sdk }}
          version: ${{ steps.versions.outputs.sdk }}
          include_paths: packages/sdk/**
          release_notes: ${{ steps.versions.outputs.sdk_notes }}
          links: |
            NPM=https://www.npmjs.com/package/@linear/sdk/v/${{ steps.versions.outputs.sdk }}
            GitHub=${{ github.server_url }}/${{ github.repository }}/releases/tag/%40linear/sdk%40${{ steps.versions.outputs.sdk }}
            Action Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Sync Linear import release
        if: steps.versions.outputs.import
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_IMPORT_RELEASE_ACCESS_KEY }}
          name: ${{ steps.versions.outputs.import }}
          version: ${{ steps.versions.outputs.import }}
          include_paths: packages/import/**
          release_notes: ${{ steps.versions.outputs.import_notes }}
          links: |
            NPM=https://www.npmjs.com/package/@linear/import/v/${{ steps.versions.outputs.import }}
            GitHub=${{ github.server_url }}/${{ github.repository }}/releases/tag/%40linear/import%40${{ steps.versions.outputs.import }}
            Action Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, release, github-release]
    permissions:
      actions: read
      contents: read
    if: ${{ always() && github.ref_name == 'master' && contains(needs.*.result, 'failure') }}
    steps:
      - uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # 2.3.0
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "SDK CI check failed on master branch"
          message_format: ":x: Check failed in <{repo_url}|{repo}@{branch}> on <{commit_url}|{commit_sha}>"
          footer: <{run_url}|View Run>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
